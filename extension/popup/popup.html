<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InboxGuard Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-shield">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">InboxGuard</h1>
          <span class="status-pill" id="status-badge">
            <span class="pulse-dot"></span> <span id="status-text">Connecting...</span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-sync" class="icon-btn" title="Sync & Analyze Mailbox">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- KPI Metric Cards -->
    <div class="kpi-grid">
      <div class="kpi-card" data-tab="urgent">
        <span class="kpi-label">Urgent</span>
        <span class="kpi-value text-amber" id="kpi-urgent">-</span>
      </div>
      <div class="kpi-card" data-tab="storage">
        <span class="kpi-label">Waste</span>
        <span class="kpi-value text-rose" id="kpi-waste">-</span>
      </div>
      <div class="kpi-card" data-tab="jobs">
        <span class="kpi-label">Jobs</span>
        <span class="kpi-value text-emerald" id="kpi-jobs">-</span>
      </div>
      <div class="kpi-card" data-tab="approvals">
        <span class="kpi-label">Approvals</span>
        <span class="kpi-value text-indigo" id="kpi-approvals">-</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="urgent">Attention</button>
      <button class="tab-btn" data-tab="storage">Storage</button>
      <button class="tab-btn" data-tab="jobs">Jobs</button>
      <button class="tab-btn" data-tab="approvals">Approvals</button>
    </nav>

    <!-- Tab Panels -->
    <main class="content-area">
      <!-- Urgent Attention Tab -->
      <div id="panel-urgent" class="tab-panel active">
        <div class="list-container" id="urgent-list">
          <div class="loading-state">Loading intelligence...</div>
        </div>
      </div>

      <!-- Storage Tab -->
      <div id="panel-storage" class="tab-panel">
        <div class="storage-summary-card">
          <div>
            <div class="sub-heading">Recoverable Space</div>
            <div class="metric-highlight" id="storage-recoverable">- MB</div>
          </div>
          <button id="btn-quick-archive" class="btn-secondary">Stage Clean</button>
        </div>
        <div class="list-container" id="storage-list"></div>
      </div>

      <!-- Jobs Tab -->
      <div id="panel-jobs" class="tab-panel">
        <div class="list-container" id="jobs-list"></div>
      </div>

      <!-- Approvals Tab -->
      <div id="panel-approvals" class="tab-panel">
        <div class="list-container" id="approvals-list"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button id="btn-open-dashboard" class="btn-primary">
        <span>Open Full Control Center</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
      </button>
      <div class="footer-note">
        <span class="shield-tag">Policy Guard: Active</span>
        <span>Untrusted Input Quarantine</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
